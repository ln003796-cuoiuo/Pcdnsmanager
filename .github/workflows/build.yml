name: build-exe
on:
  push:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --uac-admin --name DnsManager dns_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: DnsManager-exe
          path: dist/DnsManager.exe
